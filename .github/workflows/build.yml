name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is already installed on GitHub's Ubuntu servers (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk thai-vocab-recorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thai-vocab-recorder-apk
          path: thai-vocab-recorder.apk
          retention-days: 30

      # Screenshots of the main screens, drawn without a phone (Paparazzi).
      - name: Screenshots
        id: screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png
          if-no-files-found: ignore
          retention-days: 30

      # On the default branch, publish the APK as the "latest" GitHub release. The app
      # reads version.json from there to offer "Install update" with one tap.
      - name: Write version.json
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}"}' > version.json

      - name: Publish latest release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          files: |
            thai-vocab-recorder.apk
            version.json
