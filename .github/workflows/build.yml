name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk thai-vocab-recorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thai-vocab-recorder-apk
          path: thai-vocab-recorder.apk
          retention-days: 30

      # On the main branch, also publish the APK as the "latest" GitHub release,
      # so it can be downloaded on the phone directly (no zip file).
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.run_number }})
          make_latest: true
          files: thai-vocab-recorder.apk
