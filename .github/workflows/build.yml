name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Finds out which app the push changed. A change in core/ or in the build files
  # affects both apps.
  changes:
    runs-on: ubuntu-latest
    outputs:
      recorder: ${{ steps.filter.outputs.recorder }}
      boox: ${{ steps.filter.outputs.boox }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'core/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/**'
            recorder:
              - *shared
              - 'app/**'
            boox:
              - *shared
              - 'boox/**'

  # Phone app (app/).
  recorder:
    needs: changes
    if: needs.changes.outputs.recorder == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is already installed on GitHub's Ubuntu servers (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :core:testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk thai-vocab-recorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thai-vocab-recorder-apk
          path: thai-vocab-recorder.apk
          retention-days: 30

      # Screenshots of the main screens, drawn without a phone (Paparazzi).
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon :app:recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png
          if-no-files-found: ignore
          retention-days: 30

      # On the default branch, publish the APK as the "latest" GitHub release. The app
      # reads version.json from there to offer "Install update" with one tap.
      - name: Write version.json
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}"}' > version.json

      - name: Publish latest release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          files: |
            thai-vocab-recorder.apk
            version.json

  # Boox tablet app (boox/).
  boox:
    needs: changes
    if: needs.changes.outputs.boox == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :core:testDebugUnitTest :boox:testDebugUnitTest --tests "*InkTest" :boox:assembleRelease

      - name: Rename APK
        run: cp boox/build/outputs/apk/release/boox-release.apk thai-vocab-boox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thai-vocab-boox-apk
          path: thai-vocab-boox.apk
          retention-days: 30

      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon :boox:recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-boox
          path: boox/src/test/snapshots/images/*.png
          if-no-files-found: ignore
          retention-days: 30

      # The tablet app reads version-boox.json for its own "Install update" banner.
      # This step adds two files to the same "latest" release and keeps the phone app's files.
      - name: Write version-boox.json
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}"}' > version-boox.json

      - name: Publish latest release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          files: |
            thai-vocab-boox.apk
            version-boox.json
